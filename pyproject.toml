[project]
name = "gz-mindload"
version = "0.1.0"
description = "Cognitive complexity scorer over CPython's ast: a Python API and a CLI"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "g0" }]
dependencies = ["pydantic>=2.14.1"]

[project.scripts]
gz-mindload = "gz_mindload.cognitive:main"

[project.urls]
Repository = "https://github.com/tvproductions/gz-mindload"

[build-system]
requires = ["uv_build==0.13.9"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.5"
python-preference = "only-managed"

[tool.uv.build-backend]
module-name = "gz_mindload"

[dependency-groups]
dev = [
    "ruff==0.17.6",
    "ty==0.0.107",
    "pre-commit==4.7.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]
